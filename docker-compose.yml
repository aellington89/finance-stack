# Defines the five services that make up the finance stack:
# postgres (data store), init-script (one-shot balance rebuild),
# finance-app (Next.js UI), importer (file ingestion),
# and metabase (BI dashboards, --profile bi).

name: finance-stack                    # Ensures consistent container/volume naming regardless of directory

# Shared logging config — keeps logs from filling the disk (30 MB max per service).
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Primary PostgreSQL database that stores all financial data.
  postgres:
    image: postgres:18.4
    container_name: postgres
    restart: unless-stopped              # Auto-restart on crash or Docker daemon restart
    environment:                         # All credentials sourced from .env — see .env.example for the template
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}           # Default system DB; the Finances DB is created by the backup restore
      MB_DB_USER: ${MB_DB_USER}             # Passed through so init-db script can create the Metabase role
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_DBNAME: ${MB_DB_DBNAME}
    ports:
      # 5433 avoids conflicts with a local Postgres on the default port. Bound to
      # loopback (#130): reachable from this host only, refused on the LAN. Local
      # clients (psql, DBeaver, `npm run dev`) keep using localhost:5433; the
      # services reach the DB over appnet, which is unaffected by this.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql  # PG18 moved PGDATA to /var/lib/postgresql/18/docker; mount the parent
      - ./init-db:/docker-entrypoint-initdb.d:ro  # Runs once on first start (empty data dir) to create DBs and roles
    networks:
      - appnet
    logging: *default-logging
    healthcheck:                 # Other services wait on this check before starting
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
    labels:
      com.finance-stack.component: "database"
      com.finance-stack.description: "Primary PostgreSQL database"

  # One-shot job: applies pending Drizzle migrations to Finances and Finances_Test,
  # then seeds lookup tables (and Finances_Test mock data), then exits. Idempotent.
  # finance-app and importer wait on it via service_completed_successfully.
  migrate:
    build:
      context: ./app
      dockerfile: Dockerfile
      target: migrate
    container_name: finance-migrate
    restart: "no"                        # One-shot job — must not restart after exiting
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}          # Superuser: this job applies DDL and creates roles
      PGPASSWORD: ${POSTGRES_PASSWORD}
      FINANCE_APP_DB: ${FINANCE_APP_DB:-Finances}
      # Passwords for the least-privilege service roles this job creates (#130).
      # Deliberately no defaults — migrate-and-seed.sh aborts if any is empty
      # rather than creating a login role with a blank password.
      FINANCE_APP_DB_PASSWORD: ${FINANCE_APP_DB_PASSWORD}
      FINANCE_IMPORTER_DB_PASSWORD: ${FINANCE_IMPORTER_DB_PASSWORD}
      FINANCE_METABASE_DB_PASSWORD: ${FINANCE_METABASE_DB_PASSWORD}
    volumes:
      - ./init-db/seeds:/seeds:ro        # Seed SQL files consumed by migrate-and-seed.sh
      - ./init-db/roles:/roles:ro        # Role creation + grant SQL (#130)
      - ./scripts:/scripts:ro            # For the on-demand role check — see scripts/verify-db-roles.sh
    networks:
      - appnet
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    labels:
      com.finance-stack.component: "migrate"
      com.finance-stack.description: "One-shot Drizzle migration + seed runner"

  # One-shot job: runs update-account-balance-history.sql after postgres is healthy,
  # then exits. Rebuilds the account_balance_history table with fresh cumulative balances.
  # Behind the "init" profile — only runs when explicitly requested:
  #   docker compose --profile init run --rm init-script
  init-script:
    image: postgres:18.4
    profiles: ["init"]                   # Not started by default; run with --profile init
    restart: "no"                        # One-shot job — must not restart after exiting
    depends_on:
      postgres:
        condition: service_healthy  # Waits for postgres to pass its healthcheck before running
    networks:
      - appnet
    environment:                         # Credentials via env vars; PGHOST/PGUSER/PGDATABASE are native psql vars
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${INIT_SCRIPT_DB:-Finances}
    volumes:
      - ./scripts:/scripts:ro            # Read-only mount — container should not modify scripts
    entrypoint: >
      bash -c "
      set -euo pipefail;
      echo 'Waiting for $${PGDATABASE} database...';
      until psql -c 'SELECT 1' > /dev/null 2>&1; do
        echo 'Database not ready, retrying in 2s...';
        sleep 2;
      done;
      echo 'Running update-account-balance-history.sql...';
      psql -f /scripts/update-account-balance-history.sql;
      echo 'Done.';
      "
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    labels:
      com.finance-stack.component: "init"
      com.finance-stack.description: "One-shot balance history rebuild"

  # Next.js 16 application — custom finance management UI.
  # Built from the app/ directory using a multi-stage Dockerfile.
  finance-app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:                                # Build-time version stamp (see scripts/build.sh); defaults keep `up` argument-free
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
      additional_contexts:                 # Supplies repo-root CHANGELOG.md to the runner COPY --from=changelog
        # Default `.` = project dir (repo root) for local builds. CI overrides with an
        # absolute path via $CHANGELOG_CONTEXT because some Compose/buildx versions resolve
        # a relative additional_contexts path against the build context (./app) rather than
        # the project dir, which breaks `COPY --from=changelog CHANGELOG.md` (see release.yml).
        changelog: ${CHANGELOG_CONTEXT:-.}
    image: finance-app:latest            # Stable local tag so `build` and `up` share one image; the release workflow re-tags it finance-app:<version>/<sha>
    container_name: finance-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Connects as finance_app, not the superuser (#130): full DML on the core
      # tables, SELECT-only on users, and no DDL. See docs/database.md.
      DATABASE_URL: postgresql://finance_app:${FINANCE_APP_DB_PASSWORD}@postgres:5432/${FINANCE_APP_DB:-Finances}
      AUTH_SECRET: ${AUTH_SECRET}       # Signs/encrypts Auth.js session JWTs — see .env.example
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - appnet
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    labels:
      com.finance-stack.component: "app"
      com.finance-stack.description: "Next.js finance application"

  # Importer — polls subdirectories under imports/ every 60 seconds, routes
  # each file to a matching parser in importer/parsers/, and inserts transaction rows.
  importer:
    image: python:3.13-slim
    container_name: importer
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Connects as finance_importer (#130): append-only on transactions plus
      # SELECT on the lookup tables it resolves FKs against. It cannot UPDATE or
      # DELETE anything, so a bad parser can only ever add rows.
      DATABASE_URL: postgresql://finance_importer:${FINANCE_IMPORTER_DB_PASSWORD}@postgres:5432/${FINANCE_APP_DB:-Finances}
      POLL_INTERVAL: 60
    volumes:
      - ./imports:/input                      # Host drop folder — each subdirectory is an import type
      - ./importer:/app:ro                   # Poll script and parsers (read-only)
    working_dir: /app
    entrypoint: >
      bash -c "
      pip install --quiet -r /app/requirements.txt &&
      echo 'importer ready — polling /input subdirectories every $${POLL_INTERVAL}s' &&
      python poll.py
      "
    networks:
      - appnet
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
    labels:
      com.finance-stack.component: "importer"
      com.finance-stack.description: "File importer service"

  # Scheduled logical backups. Runs pg_dump (custom format) of each database in
  # BACKUP_DBS to ./backups/ on a loop, pruning dumps older than the retention
  # window. Reuses the postgres:18.0 image so pg_dump stays version-matched to
  # the server. Restore a dump with scripts/restore.sh. See docs/backups.md.
  pg-backup:
    image: postgres:18.4
    container_name: pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy   # Only needs a reachable DB, not the app
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Defaults track the configured DB names; override with BACKUP_DBS in .env
      BACKUP_DBS: ${BACKUP_DBS:-${FINANCE_APP_DB:-Finances},${MB_DB_DBNAME:-metabase}}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/scripts:ro        # Read-only — container should not modify scripts
      - ./backups:/backups           # Host-visible dump output (gitignored — financial data)
    entrypoint: >
      bash -c "
      set -uo pipefail;
      echo \"pg-backup ready — dumping [$${BACKUP_DBS}] every $${BACKUP_INTERVAL_SECONDS}s, retention $${BACKUP_RETENTION_DAYS}d\";
      while true; do
        /scripts/backup.sh || echo '[backup] run failed — will retry next cycle';
        sleep \"$${BACKUP_INTERVAL_SECONDS}\";
      done
      "
    networks:
      - appnet
    logging: *default-logging
    healthcheck:                     # Unhealthy if no dump is newer than 1.5x the interval (stalled loop)
      test: ["CMD-SHELL", "find \"$${BACKUP_DIR}\" -name '*.dump' -mmin -$$(( BACKUP_INTERVAL_SECONDS * 3 / 2 / 60 + 1 )) | grep -q . || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s              # First dump runs at container start; allow time to land
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    labels:
      com.finance-stack.component: "backup"
      com.finance-stack.description: "Scheduled pg_dump backups with retention pruning"

  # Metabase BI tool for dashboards and ad-hoc analytics against the Finances database.
  # Stores its own internal metadata (questions, dashboards, users) in a separate metabase DB.
  #
  # The MB_DB_* vars below configure only that internal metadata DB (owned by the
  # non-superuser MB_DB_USER role). Metabase's *analytics* connection to Finances is
  # stored inside its own metadata DB, not in env, so it cannot be set here: point it
  # at the finance_metabase role (views only, #130) once in the admin UI — see the
  # "Roles & privileges" section of docs/database.md.
  metabase:
    image: metabase/metabase:v0.58.8
    container_name: metabase
    profiles: ["bi"]                   # Not started by default; run with --profile bi
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"    # Loopback only (#130) — Metabase has no auth in front of it on the LAN
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${MB_DB_DBNAME}         # Metabase's internal state DB — separate from the Finances DB
      MB_DB_PORT: 5432
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      MB_DB_HOST: postgres
      TZ: ${TZ:-America/Chicago}            # Ensures chart timestamps and date grouping use local time
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy  # Waits for postgres healthcheck, not just container start
    networks:
      - appnet
    logging: *default-logging
    healthcheck:                   # Metabase exposes a health API endpoint
      test: ["CMD-SHELL", "curl --fail -I http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s          # Metabase can take 1-2 min on first startup (DB migrations)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
    labels:
      com.finance-stack.component: "bi"
      com.finance-stack.description: "Metabase BI dashboards"

volumes:
  postgres_data:    # Persists PostgreSQL data across container restarts
  metabase_data:    # Persists Metabase dashboards, questions, and settings

networks:
  appnet:
    driver: bridge  # Shared bridge network so services can reach each other by container name
