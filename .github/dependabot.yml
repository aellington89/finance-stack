# Dependabot configuration (Issue #131).
#
# Five ecosystems cover every dependency manifest in the repo. Note that
# `docker` and `docker-compose` are distinct ecosystems: `docker` reads
# Dockerfiles, `docker-compose` reads compose files, and we need both.
#
# Dependabot cannot follow this repo's `Issue #N - <imperative>` commit
# convention, so its PRs are an accepted exception (see CONTRIBUTING.md).
#
# Deliberately not configured: auto-merge (out of scope per Issue #131).
# Every bump gets reviewed and must pass the full gate suite.

version: 2

updates:
  # The Next.js application — the only Node package in the repo (no root
  # package.json, no workspaces).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped so a routine week arrives as two reviewable PRs rather than a
    # dozen. Majors stay ungrouped: they get their own PR and their own review.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Importer service Python dependencies (importer/requirements.txt).
  - package-ecosystem: pip
    directory: /importer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base images in app/Dockerfile (node:24-alpine).
  #
  # The node line is tracked on LTS releases only, and a bump here is only ever
  # half the change: `docker` reads Dockerfiles, so it cannot touch the
  # `node-version:` pins in ci.yml, release.yml and backup-smoke.yml, or
  # `@types/node` in app/package.json. Move all four together or CI tests on a
  # different runtime than the image ships (Issue #210).
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Service images in docker-compose.yml (postgres, python, metabase).
  # Bumping postgres here needs a matching manual bump of the `postgres:`
  # service image in .github/workflows/ci.yml and backup-smoke.yml, which
  # Dependabot does not read.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Metabase is tracked on its LTS line, which Dependabot cannot see: it
      # only knows "v0.63.1.6 is newer than v0.58.8". Metabase supports LTS
      # releases for 14 months and standard releases for ~2, so the newest tag
      # is reliably the *shorter*-lived one — PR #199 would have traded an image
      # supported to 2027-02-17 for one EOL 2026-09-07 (#213).
      #
      # Metabase versions carry a leading `0.`, so this split falls out of
      # semver parsing exactly right: moving off the LTS line (0.58 -> 0.63)
      # is a minor and is ignored, while a patch within it (0.58.8 -> 0.58.21)
      # still arrives as a PR. Revisit when the next LTS ships — 58 goes EOL
      # 2027-02-17 and the cadence looks roughly annual.
      - dependency-name: "metabase/metabase"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Workflow actions. These are SHA-pinned; Dependabot rewrites both the SHA
  # and its trailing `# vX.Y.Z` comment, which is what keeps pinning
  # maintainable rather than a one-off snapshot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
