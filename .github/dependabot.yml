# Dependabot configuration (Issue #131).
#
# Five ecosystems cover every dependency manifest in the repo, across seven
# entries — `docker` is declared once per Dockerfile directory. Note that
# `docker` and `docker-compose` are distinct ecosystems: `docker` reads
# Dockerfiles, `docker-compose` reads compose files, and we need both.
#
# Dependabot cannot follow this repo's `Issue #N - <imperative>` commit
# convention, so its PRs are an accepted exception (see CONTRIBUTING.md).
#
# Deliberately not configured: auto-merge (out of scope per Issue #131).
# Every bump gets reviewed and must pass the full gate suite.

version: 2

updates:
  # The Next.js application — the only Node package in the repo (no root
  # package.json, no workspaces).
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped so a routine week arrives as two reviewable PRs rather than a
    # dozen. Majors stay ungrouped: they get their own PR and their own review.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # TypeScript is held on the 6.x line. 7.x is the native port and does not
      # expose the JS compiler API that `next build` drives for its type-check
      # pass, so Next 16.2.12 refuses it outright ("TypeScript 7.0.2 does not
      # provide the compiler API required by Next.js"); it is also outside
      # typescript-eslint 8.66's peer range of `>=4.8.4 <6.1.0`. Two independent
      # blockers, neither of which this repo can resolve on its own.
      #
      # This is ignored rather than left to fail because 7.0.2 is `latest` on
      # npm: without the rule Dependabot re-raises the same unmergeable PR every
      # week (PR #246 was the first), and a permanently-red Dependabot PR is how
      # a real regression on some *other* bump gets waved through as "the usual
      # red". The `~6.0` pin in app/package.json is the matching half — see the
      # `//typescript` note there for why the ceiling is a tilde.
      #
      # Lift this once Next ships support (or `experimental.useTypeScriptCli`
      # stops being experimental) AND typescript-eslint widens its peer range.
      # Minor and patch updates within 6.x still arrive normally. Note that a
      # future 6.1 is a *minor*, so it will arrive as a PR moving `~6.0` ->
      # `~6.1` — and that crosses typescript-eslint's `<6.1.0` ceiling. Check
      # its peer range before merging that one rather than assuming a minor is
      # routine; this pair is the reason the tilde is there.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # ESLint is held on the 9.x line. 10.x removed the deprecated rule-context
      # accessors (`context.getFilename()` and friends, superseded by
      # `context.filename` in 8.40), and the plugins `eslint-config-next`
      # vendors still call them: ESLint 10 crashes at rule-load time with
      # "Error while loading rule 'react/display-name':
      # contextOrFilename.getFilename is not a function" before it lints a
      # single file (PR #247).
      #
      # This is not one stale plugin. Of the four eslint-config-next 16.3.0
      # vendors, only @next/eslint-plugin-next accepts ESLint 10 —
      # eslint-plugin-react caps its peer at ^9.7, eslint-plugin-import and
      # eslint-plugin-jsx-a11y at ^9, eslint-plugin-react-hooks at ^9.0.0. Nor
      # is a config bump the way out: eslint-config-next 16.3.0 still depends on
      # `eslint-plugin-react: ^7.37.0`, and 7.37.5 — still `latest` — is the only
      # release satisfying it. No version of the Next lint config runs on
      # ESLint 10 today.
      #
      # Ignored rather than left to fail for the same reason as typescript
      # above: 10.8.1 is `latest`, so Dependabot re-raises the identical
      # unmergeable PR every week. Staying on 9 is not drift — 9.39.5 carries
      # npm's `maintenance` dist-tag. The alternative, disabling the react,
      # import and a11y rule sets, would trade real lint coverage for a
      # dev-dependency bump.
      #
      # Issue #263 is the tracker. It used to be #194, which read this rule and
      # the non-blocking build-time `npm audit` gate as one upstream event:
      # npm's only offered fix for the ~10 HIGH advisories in the eslint 9 dev
      # tree was eslint@10, so the gate could not close until this rule lifted.
      # It closed anyway. Those advisories were patched within the ranges the
      # lockfile already resolved — an `npm update` cleared them and the gate
      # has been blocking since #194 — while this rule did not move. Worth
      # stating because the inference is easy to make again: a dev-tree advisory
      # naming eslint@10 as its fix is not evidence that this rule has to lift,
      # only that npm prefers the major it can see.
      #
      # Lift this once eslint-config-next ships plugins whose peers accept
      # ESLint 10 — eslint-plugin-react > 7.37.5 is the one to watch. Minor and
      # patch updates within 9.x still arrive normally. The `^9` in
      # app/package.json is the matching half.
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"

  # Importer service Python dependencies (importer/requirements.txt).
  - package-ecosystem: pip
    directory: /importer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base images in app/Dockerfile (node:24-alpine).
  #
  # The node line is tracked on LTS releases only, and a bump here is only ever
  # half the change: `docker` reads Dockerfiles, so it cannot touch the
  # `node-version:` pins in ci.yml, release.yml and backup-smoke.yml, or
  # `@types/node` in app/package.json. Move all four together or CI tests on a
  # different runtime than the image ships (Issue #210).
  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base image in importer/Dockerfile (python:3.14-slim). Issue #224 moved this
  # pin out of docker-compose.yml, where the `docker-compose` ecosystem below was
  # reading it — without this entry the importer's base would silently stop being
  # tracked.
  - package-ecosystem: docker
    directory: /importer
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Base image in scripts/Dockerfile (postgres:18.4). Same reasoning as
  # /importer above, plus a hard constraint: pg_dump must be version-matched to
  # the server, so a bump here is only correct alongside the `postgres` service
  # in docker-compose.yml and the `postgres:` service containers in ci.yml and
  # backup-smoke.yml. Do not merge it on its own — see scripts/Dockerfile.
  - package-ecosystem: docker
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Service images in docker-compose.yml (postgres, metabase). Since #224 the
  # python and backup images are built from Dockerfiles, so their bases arrive
  # through the `docker` entries above rather than here.
  # Bumping postgres here needs a matching manual bump of the `postgres:`
  # service image in .github/workflows/ci.yml and backup-smoke.yml — which
  # Dependabot does not read — and of scripts/Dockerfile, which it reads as a
  # separate ecosystem and will not group with this PR.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Metabase is tracked on its LTS line, which Dependabot cannot see: it
      # only knows "v0.63.1.6 is newer than v0.58.8". Metabase supports LTS
      # releases for 14 months and standard releases for ~2, so the newest tag
      # is reliably the *shorter*-lived one — PR #199 would have traded an image
      # supported to 2027-02-17 for one EOL 2026-09-07 (#213).
      #
      # Metabase versions carry a leading `0.`, so this split falls out of
      # semver parsing exactly right: moving off the LTS line (0.58 -> 0.63)
      # is a minor and is ignored, while a patch within it (0.58.8 -> 0.58.21)
      # still arrives as a PR. Revisit when the next LTS ships — 58 goes EOL
      # 2027-02-17 and the cadence looks roughly annual.
      - dependency-name: "metabase/metabase"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Workflow actions. These are SHA-pinned; Dependabot rewrites both the SHA
  # and its trailing `# vX.Y.Z` comment, which is what keeps pinning
  # maintainable rather than a one-off snapshot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
