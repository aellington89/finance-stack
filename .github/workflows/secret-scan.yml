name: Secret scan

# Gitleaks gate (Issue #181). #131 hardened CI for dependencies and images but
# left committed credentials unscanned, so this is the missing half: it fails
# the build when a secret reaches a commit, rather than relying on review.
#
# It is a separate workflow rather than a job in ci.yml because of the schedule.
# The action's scan scope follows the event: on `push` and `pull_request` it
# scans only the commits in that range — fast, and the part that blocks a merge
# — while `schedule` and `workflow_dispatch` scan the **full history**. Folding
# that into ci.yml would mean either dropping the full-history sweep or running
# the whole postgres + image + Trivy suite on a cron to get it.
#
# Why the weekly sweep is not redundant with the per-push scan: a force-pushed
# branch rewrites commits the range scan never sees, and gitleaks' rules gain
# detections over time, so history that was clean under last month's ruleset is
# not necessarily clean under this month's.
#
# There is deliberately no .gitleaks.toml. The default ruleset scans this
# repository's entire history clean (verified at 8.30.1, 134 non-merge commits),
# so a config file today would hold nothing but speculative allowlists — and a
# broad allowlist added "just in case" is exactly how a real secret gets waved
# through later. If a test fixture ever trips a rule, add a config that
# allowlists it by **path and exact value**, never by widening a pattern, and
# say in a comment what the value is and why it is not a secret.
#
# GITLEAKS_LICENSE is not set: it is required only for repositories owned by an
# organization account, and this one is owned by a personal account.
#
# See docs/secrets.md.

on:
  push:
    branches: [master, test]
  pull_request:
  workflow_dispatch:            # Manual full-history sweep
  schedule:
    - cron: '0 5 * * 1'         # Mondays 05:00 UTC, an hour ahead of backup-smoke

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # Full history — a shallow clone has nothing for the sweep to scan

      # Actions are SHA-pinned repo-wide (Issue #131); Dependabot's
      # github-actions ecosystem rewrites the SHA and its version comment
      # together. The pin also fixes the gitleaks version, which the action
      # hard-codes per release — so the scanner moves when a reviewed PR moves
      # it, and not before.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
