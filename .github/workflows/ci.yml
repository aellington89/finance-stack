name: CI

on:
  push:
    branches: [master, test]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same tag as docker-compose.yml so CI exercises the
        # version that actually ships (Issue #131). Workflow service containers
        # are read by neither the `docker` nor the `docker-compose` Dependabot
        # ecosystem, so this pin is bumped by hand alongside compose.
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Issue #131. Runtime dependencies are the blocking gate: everything here
      # ships inside the image. `overrides` in package.json lift next's vendored
      # postcss/sharp, which is what keeps this green.
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      # Build-time dependencies are reported but do not block. The eslint 9
      # toolchain currently carries HIGH advisories whose only fix is eslint 10,
      # which eslint-config-next does not yet support (its vendored
      # eslint-plugin-react crashes on eslint 10's rule API). Flip this to a
      # blocking step once that lands upstream.
      - name: Dependency audit (build-time, advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Create test database
        env:
          PGPASSWORD: changeme
        run: psql -h localhost -U postgres -c 'CREATE DATABASE "Finances_Test";'

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: npm run db:migrate

      - name: Seed test database
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/shared-lookups.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/finances-test-mock-data.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/rebuild-balance-history.sql

      # Issue #130. CI's postgres service is a bare image — it never runs
      # init-db — so create the roles and apply the grants explicitly. These are
      # the exact files the migrate service runs against the real databases: one
      # authority, exercised twice.
      - name: Create service roles and apply grants
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -v app_password=ci-app-pw \
            -v importer_password=ci-importer-pw \
            -v metabase_password=ci-metabase-pw \
            -v bi_password=ci-bi-pw \
            -f ../init-db/roles/01-create-roles.sql
          psql -v ON_ERROR_STOP=1 -d "Finances_Test" \
            -v OWNER=postgres -f ../init-db/roles/02-grants.sql

      # Issue #239. Stands up Metabase's metadata role and database the way
      # init-db/01-create-databases.sh does, then applies the convergence file
      # the migrate service applies. Without this the cluster holds exactly the
      # three roles the gate used to name, so a sweep over "every login role"
      # would be a sweep over the same three and would prove nothing — the
      # second login role is the whole point.
      - name: Create the Metabase metadata role and database
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -c "CREATE ROLE metabase_user LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
                  NOREPLICATION NOBYPASSRLS PASSWORD 'ci-metabase-meta-pw';" \
            -c 'CREATE DATABASE metabase OWNER metabase_user;'
          psql -v ON_ERROR_STOP=1 -d metabase \
            -v mb_user=metabase_user -f ../init-db/roles/03-metabase-role.sql

      # Asserts the grant matrix against the catalog, then connects as each role
      # and runs real statements (see scripts/verify-db-roles.sh). PGHOST is
      # localhost, which reaches the service container through Docker's port
      # forwarding and so authenticates with a password — a `trust` path would
      # make the credential half of this check vacuous.
      - name: Role privilege gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
          FINANCE_APP_DB_PASSWORD: ci-app-pw
          FINANCE_IMPORTER_DB_PASSWORD: ci-importer-pw
          FINANCE_METABASE_DB_PASSWORD: ci-metabase-pw
          FINANCE_BI_DB_PASSWORD: ci-bi-pw
          MB_DB_USER: metabase_user
          MB_DB_DBNAME: metabase
          MB_DB_PASS: ci-metabase-meta-pw
          ROLES_DIR: ../init-db/roles
        run: bash ../scripts/verify-db-roles.sh Finances_Test

      # Issue #239. A green gate proves nothing about a gate that cannot fail,
      # and the drift this one exists to catch is invisible in a passing run:
      # metabase_user sat beside the three service roles as a full SUPERUSER for
      # months while the matrix reported OK, because the sweep iterated a
      # hand-maintained list of three names. Each case below introduces a real
      # violation, asserts the gate rejects it, and reverts it.
      - name: Attribute gate negative check
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail

          gate_must_fail() {
            if psql -q -v ON_ERROR_STOP=1 -d "Finances_Test" \
                 -f ../init-db/roles/assert-grants.sql >/dev/null 2>&1; then
              echo "::error::assert-grants.sql passed while $1. The attribute sweep is not covering every login role — see init-db/roles/assert-grants.sql (issue #239)."
              exit 1
            fi
            echo "ok  gate fails when $1"
          }

          # 1. The exact drift #239 was opened for. Reverted by re-running the
          #    convergence file, which also proves it repairs a widened role
          #    rather than only setting attributes on a fresh one.
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'ALTER ROLE metabase_user SUPERUSER;'
          gate_must_fail "metabase_user is a superuser"
          psql -q -v ON_ERROR_STOP=1 -d metabase \
            -v mb_user=metabase_user -f ../init-db/roles/03-metabase-role.sql > /dev/null

          # 2. A login role the stack has never heard of, carrying an attribute.
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE rogue_superuser LOGIN SUPERUSER;'
          gate_must_fail "an undeclared login role is a superuser"
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'DROP ROLE rogue_superuser;'

          # 3. Attribute-free, but reaching a database it was never declared
          #    for — the half of the sweep that contains rather than de-escalates.
          psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c 'CREATE ROLE rogue_analyst LOGIN;' \
            -c 'GRANT CONNECT ON DATABASE "Finances_Test" TO rogue_analyst;'
          gate_must_fail "an undeclared login role holds CONNECT"
          psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c 'REVOKE ALL ON DATABASE "Finances_Test" FROM rogue_analyst;' \
            -c 'DROP ROLE rogue_analyst;'

          # Every case above must have been reverted, or the steps after this
          # one are running against a cluster this step left dirty.
          psql -v ON_ERROR_STOP=1 -d "Finances_Test" -f ../init-db/roles/assert-grants.sql

      - name: Schema drift gate
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: |
          # Run drizzle-kit generate. If schema.ts diverges from the latest
          # meta snapshot, a new migration SQL file appears under drizzle/migrations/.
          # Anything new in the working tree there = schema.ts was edited
          # without a matching migration being committed.
          npx drizzle-kit generate --name drift_check
          if [ -n "$(git status --porcelain drizzle/migrations/)" ]; then
            echo ""
            echo "::error::Schema drift detected: drizzle/schema.ts diverges from the latest migration snapshot."
            echo "Run 'npm run db:generate -- --name <description>' locally and commit the generated migration."
            git status drizzle/migrations/
            exit 1
          fi

      - name: Seed reference gate
        run: npm run check:seed-references

      # Issue #187. The static gate above proves the seed file *says* the right
      # thing; this proves it *does* it. migrate-and-seed.sh used to skip the
      # Finances seed whenever the DB held any accounts or transactions, so a
      # populated database never received a reference row added later — which is
      # how production ended up permanently missing transaction_types id=12.
      # Builds a database in exactly that state (user data present, one canonical
      # row dropped), re-applies the real seed file the migrate service runs, and
      # asserts the row comes back with user data untouched.
      - name: Reference backfill gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail
          CHECK_DB=Finances_Backfill_Check
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE \"${CHECK_DB}\";"
          DATABASE_URL="postgresql://postgres:changeme@localhost:5432/${CHECK_DB}" npm run db:migrate
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" -f ../init-db/seeds/shared-lookups.sql

          # A populated database — this is what the old row-count guard skipped
          # on. 'Checking Account' under Current Asset must pick up its liquidity
          # default; 'Earmarked' under Current Liability shares a name with a
          # restricted asset type and must NOT, which is what scoping the
          # liquidity UPDATEs to the asset categories buys.
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" <<'SQL'
          INSERT INTO account_types (account_type, account_type_category_id) VALUES
              ('Checking Account', 1),
              ('Earmarked', 5);
          INSERT INTO accounts (account_name, account_type_id)
              SELECT 'Backfill Check Account', account_type_id
              FROM account_types WHERE account_type = 'Checking Account';
          INSERT INTO transaction_categories (transaction_category_id, transaction_category)
              OVERRIDING SYSTEM VALUE VALUES (6, 'Other')
              ON CONFLICT (transaction_category_id) DO NOTHING;
          INSERT INTO transactions
              (transaction_description, transaction_date, account_id, amount,
               transaction_type_id, transaction_category_id)
              SELECT 'Backfill check expense', CURRENT_DATE, account_id, -10.00, 2, 6
              FROM accounts WHERE account_name = 'Backfill Check Account';
          SQL

          # Reproduce the production drift, then apply the fix.
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" \
            -c 'DELETE FROM transaction_types WHERE transaction_type_id = 12;'
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" -f ../init-db/seeds/shared-lookups.sql

          # One exception listing every failure, as assert-grants.sql does.
          if ! psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" <<'SQL'
          DO $$
          DECLARE
              failures text[] := '{}';
              actual   text;
              n        bigint;
          BEGIN
              SELECT transaction_type INTO actual
              FROM transaction_types WHERE transaction_type_id = 12;
              IF actual IS DISTINCT FROM 'Opening Balance' THEN
                  failures := failures || format(
                      'transaction_types id=12 was not backfilled (got %L)', actual);
              END IF;

              SELECT count(*) INTO n FROM accounts;
              IF n <> 1 THEN failures := failures || format('accounts changed: %s (want 1)', n); END IF;

              SELECT count(*) INTO n FROM transactions;
              IF n <> 1 THEN failures := failures || format('transactions changed: %s (want 1)', n); END IF;

              SELECT liquidity_class INTO actual
              FROM account_types WHERE account_type = 'Checking Account';
              IF actual IS DISTINCT FROM 'liquid' THEN
                  failures := failures || format(
                      'asset type Checking Account should default to liquid (got %L)', actual);
              END IF;

              SELECT liquidity_class INTO actual
              FROM account_types WHERE account_type = 'Earmarked';
              IF actual IS NOT NULL THEN
                  failures := failures || format(
                      'liability type Earmarked must stay unclassified (got %L)', actual);
              END IF;

              SELECT last_value INTO n
              FROM pg_sequences
              WHERE schemaname = 'public' AND sequencename = 'transaction_types_transaction_type_id_seq';
              IF n IS NULL OR n < 12 THEN
                  failures := failures || format(
                      'transaction_types sequence not resynced past the seeded ids (got %s)', n);
              END IF;

              IF array_length(failures, 1) > 0 THEN
                  RAISE EXCEPTION E'reference backfill gate failed:\n  - %',
                      array_to_string(failures, E'\n  - ');
              END IF;

              RAISE NOTICE 'reference backfill OK: id=12 restored, user data and liability classification untouched';
          END
          $$;
          SQL
          then
            echo "::error::Reference backfill gate: re-running init-db/seeds/shared-lookups.sql against a populated database did not restore the canonical reference rows, or it disturbed user data. See app/scripts/migrate-and-seed.sh and the seed file's contract header (issue #187)."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE \"${CHECK_DB}\";"

      - name: Changelog gate
        run: npm run check:changelog

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
          AUTH_SECRET: ci-only-integration-test-secret
        run: npm run test:integration

  # Issue #131. Builds the production image on every PR — previously it was only
  # built on a `v*` tag by release.yml, so a broken Dockerfile reached master
  # undetected — and scans it for known vulnerabilities. Runs as its own job so
  # the image build and the database-backed gates above don't queue behind each
  # other; both must be green to merge.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `docker compose build`, not a bare `docker build`: the runner stage does
      # `COPY --from=changelog CHANGELOG.md`, which needs the `changelog` entry
      # in compose's additional_contexts (CHANGELOG.md lives outside ./app).
      # This matches how release.yml builds the image.
      - name: Build app image
        env:
          # Absolute path, for the same reason release.yml sets it: a relative
          # additional_contexts path is resolved against ./app rather than the
          # repo root on some Compose/buildx versions, and CHANGELOG.md is at
          # the root.
          CHANGELOG_CONTEXT: ${{ github.workspace }}
        run: docker compose build finance-app

      # Actions are SHA-pinned repo-wide (Issue #131) — mutable tags are exactly
      # how this action was used to ship malware in March 2026.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-app:latest
          severity: HIGH,CRITICAL
          # node:24-alpine carries OS CVEs with no upstream fix; blocking on
          # those makes the gate un-actionable rather than safer.
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
