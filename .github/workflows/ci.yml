name: CI

on:
  push:
    branches: [master, test]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same tag as docker-compose.yml so CI exercises the
        # version that actually ships (Issue #131). Workflow service containers
        # are read by neither the `docker` nor the `docker-compose` Dependabot
        # ecosystem, so this pin is bumped by hand alongside compose.
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Issue #131. Runtime dependencies are the blocking gate: everything here
      # ships inside the image. `overrides` in package.json lift next's vendored
      # postcss/sharp, which is what keeps this green.
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      # Build-time dependencies are reported but do not block. The eslint 9
      # toolchain currently carries HIGH advisories whose only fix is eslint 10,
      # which eslint-config-next does not yet support (its vendored
      # eslint-plugin-react crashes on eslint 10's rule API). Flip this to a
      # blocking step once that lands upstream.
      - name: Dependency audit (build-time, advisory only)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Create test database
        env:
          PGPASSWORD: changeme
        run: psql -h localhost -U postgres -c 'CREATE DATABASE "Finances_Test";'

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: npm run db:migrate

      - name: Seed test database
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/shared-lookups.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/finances-test-mock-data.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/rebuild-balance-history.sql

      # Issue #130. CI's postgres service is a bare image — it never runs
      # init-db — so create the roles and apply the grants explicitly. These are
      # the exact files the migrate service runs against the real databases: one
      # authority, exercised twice.
      - name: Create service roles and apply grants
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -v app_password=ci-app-pw \
            -v importer_password=ci-importer-pw \
            -v metabase_password=ci-metabase-pw \
            -f ../init-db/roles/01-create-roles.sql
          psql -v ON_ERROR_STOP=1 -d "Finances_Test" \
            -v OWNER=postgres -f ../init-db/roles/02-grants.sql

      # Asserts the grant matrix against the catalog, then connects as each role
      # and runs real statements (see scripts/verify-db-roles.sh). PGHOST is
      # localhost, which reaches the service container through Docker's port
      # forwarding and so authenticates with a password — a `trust` path would
      # make the credential half of this check vacuous.
      - name: Role privilege gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
          FINANCE_APP_DB_PASSWORD: ci-app-pw
          FINANCE_IMPORTER_DB_PASSWORD: ci-importer-pw
          FINANCE_METABASE_DB_PASSWORD: ci-metabase-pw
          ROLES_DIR: ../init-db/roles
        run: bash ../scripts/verify-db-roles.sh Finances_Test

      - name: Schema drift gate
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: |
          # Run drizzle-kit generate. If schema.ts diverges from the latest
          # meta snapshot, a new migration SQL file appears under drizzle/migrations/.
          # Anything new in the working tree there = schema.ts was edited
          # without a matching migration being committed.
          npx drizzle-kit generate --name drift_check
          if [ -n "$(git status --porcelain drizzle/migrations/)" ]; then
            echo ""
            echo "::error::Schema drift detected: drizzle/schema.ts diverges from the latest migration snapshot."
            echo "Run 'npm run db:generate -- --name <description>' locally and commit the generated migration."
            git status drizzle/migrations/
            exit 1
          fi

      - name: Seed reference gate
        run: npm run check:seed-references

      - name: Changelog gate
        run: npm run check:changelog

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
          AUTH_SECRET: ci-only-integration-test-secret
        run: npm run test:integration

  # Issue #131. Builds the production image on every PR — previously it was only
  # built on a `v*` tag by release.yml, so a broken Dockerfile reached master
  # undetected — and scans it for known vulnerabilities. Runs as its own job so
  # the image build and the database-backed gates above don't queue behind each
  # other; both must be green to merge.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `docker compose build`, not a bare `docker build`: the runner stage does
      # `COPY --from=changelog CHANGELOG.md`, which needs the `changelog` entry
      # in compose's additional_contexts (CHANGELOG.md lives outside ./app).
      # This matches how release.yml builds the image.
      - name: Build app image
        env:
          # Absolute path, for the same reason release.yml sets it: a relative
          # additional_contexts path is resolved against ./app rather than the
          # repo root on some Compose/buildx versions, and CHANGELOG.md is at
          # the root.
          CHANGELOG_CONTEXT: ${{ github.workspace }}
        run: docker compose build finance-app

      # Actions are SHA-pinned repo-wide (Issue #131) — mutable tags are exactly
      # how this action was used to ship malware in March 2026.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-app:latest
          severity: HIGH,CRITICAL
          # node:22-alpine carries OS CVEs with no upstream fix; blocking on
          # those makes the gate un-actionable rather than safer.
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
