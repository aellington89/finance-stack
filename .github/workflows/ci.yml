name: CI

on:
  push:
    branches: [master, test]
    tags: ['v*']
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same tag as docker-compose.yml so CI exercises the
        # version that actually ships (Issue #131). Workflow service containers
        # are read by neither the `docker` nor the `docker-compose` Dependabot
        # ecosystem, so this pin is bumped by hand alongside compose.
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Issue #131. Runtime dependencies: everything here ships inside the image.
      # `overrides` in package.json lift next's vendored postcss/sharp, which is
      # what keeps this green.
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      # Issue #194. The full tree, dev dependencies included. This step spent
      # its first months as `continue-on-error` because the eslint 9 dev
      # tree carried HIGH advisories whose only npm-offered fix was
      # eslint 10, which eslint-config-next still cannot host. That turned out
      # not to be the constraint it looked like: every one of those advisories
      # has since been patched *within* the range the lockfile already resolved
      # (brace-expansion 1.1.18/5.0.9, js-yaml 4.3.1, picomatch 2.3.2, fast-uri
      # 3.1.5), so the gate closed on eslint 9 and the eslint pin outlived it.
      # See the `//eslint` note in app/package.json for what still holds that.
      #
      # This step subsumes the runtime one above, which is kept anyway: which of
      # the two goes red is the whole diagnosis. Runtime red means the finding
      # ships to users and usually needs an `overrides` entry; build-time red
      # means it is a dev-tree bump. Merging them would cost a local re-run with
      # --omit=dev to learn the same thing. CONTRIBUTING.md carries the fix
      # procedure, including what to do about an advisory with no fix at all —
      # npm audit has no per-advisory allowlist, so unlike .trivyignore there is
      # no escape hatch here yet.
      - name: Dependency audit (build-time)
        run: npm audit --audit-level=high

      # Issues #130, #225. CI's postgres service is a bare image — it runs no
      # initdb hook and never runs the migrate job — so stand the cluster up with
      # the same files migrate does, rather than hand-written psql that can drift
      # away from them. This is the creation half; the roles and grants follow
      # below, in the order migrate-and-seed.sh applies them.
      #
      # mb_password is non-empty on purpose: it is what provisions metabase_user,
      # and a cluster holding only the three service roles would make the #239
      # "sweep every login role" gate a sweep over the same three, proving
      # nothing. It also creates an (empty, unused) Finances alongside
      # Finances_Test, which is simply what the real first install does.
      - name: Create databases and the Metabase role
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -v app_db=Finances \
            -v test_db=Finances_Test \
            -v mb_user=metabase_user \
            -v mb_dbname=metabase \
            -v mb_password=ci-metabase-meta-pw \
            -f ../init-db/roles/00-create-databases.sql

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: npm run db:migrate

      - name: Seed test database
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/shared-lookups.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/finances-test-mock-data.sql
          psql -h localhost -U postgres -d "Finances_Test" -f ../init-db/seeds/rebuild-balance-history.sql

      # Issue #130. The other half of the step above: the exact files the migrate
      # service runs against the real databases — one authority, exercised twice.
      - name: Create service roles and apply grants
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres \
            -v app_password=ci-app-pw \
            -v importer_password=ci-importer-pw \
            -v bi_password=ci-bi-pw \
            -f ../init-db/roles/01-create-roles.sql
          psql -v ON_ERROR_STOP=1 -d "Finances_Test" \
            -v OWNER=postgres -f ../init-db/roles/02-grants.sql

      # Issue #239. Converges the Metabase metadata role the way the migrate
      # service does — attributes, ownership, and its password — against the role
      # and database the creation step above stood up. Kept a step of its own,
      # after the service roles, because that is the order migrate-and-seed.sh
      # applies these files in.
      - name: Converge the Metabase metadata role
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          psql -v ON_ERROR_STOP=1 -d metabase \
            -v mb_user=metabase_user -v mb_password=ci-metabase-meta-pw \
            -f ../init-db/roles/03-metabase-role.sql

      # Asserts the grant matrix against the catalog, then connects as each role
      # and runs real statements (see scripts/verify-db-roles.sh). PGHOST is
      # localhost, which reaches the service container through Docker's port
      # forwarding and so authenticates with a password — a `trust` path would
      # make the credential half of this check vacuous.
      - name: Role privilege gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
          FINANCE_APP_DB_PASSWORD: ci-app-pw
          FINANCE_IMPORTER_DB_PASSWORD: ci-importer-pw
          FINANCE_BI_DB_PASSWORD: ci-bi-pw
          MB_DB_USER: metabase_user
          MB_DB_DBNAME: metabase
          MB_DB_PASS: ci-metabase-meta-pw
          ROLES_DIR: ../init-db/roles
        run: bash ../scripts/verify-db-roles.sh Finances_Test

      # Issue #239. A green gate proves nothing about a gate that cannot fail,
      # and the drift this one exists to catch is invisible in a passing run:
      # metabase_user sat beside the three service roles as a full SUPERUSER for
      # months while the matrix reported OK, because the sweep iterated a
      # hand-maintained list of three names. Each case below introduces a real
      # violation, asserts the gate rejects it, and reverts it.
      - name: Attribute gate negative check
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail

          gate_must_fail() {
            if psql -q -v ON_ERROR_STOP=1 -d "Finances_Test" \
                 -f ../init-db/roles/assert-grants.sql >/dev/null 2>&1; then
              echo "::error::assert-grants.sql passed while $1. The attribute sweep is not covering every login role — see init-db/roles/assert-grants.sql (issue #239)."
              exit 1
            fi
            echo "ok  gate fails when $1"
          }

          # 1. The exact drift #239 was opened for. Reverted by re-running the
          #    convergence file, which also proves it repairs a widened role
          #    rather than only setting attributes on a fresh one.
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'ALTER ROLE metabase_user SUPERUSER;'
          gate_must_fail "metabase_user is a superuser"
          psql -q -v ON_ERROR_STOP=1 -d metabase \
            -v mb_user=metabase_user -v mb_password=ci-metabase-meta-pw \
            -f ../init-db/roles/03-metabase-role.sql > /dev/null

          # 2. A login role the stack has never heard of, carrying an attribute.
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'CREATE ROLE rogue_superuser LOGIN SUPERUSER;'
          gate_must_fail "an undeclared login role is a superuser"
          psql -q -v ON_ERROR_STOP=1 -d postgres -c 'DROP ROLE rogue_superuser;'

          # 3. Attribute-free, but reaching a database it was never declared
          #    for — the half of the sweep that contains rather than de-escalates.
          psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c 'CREATE ROLE rogue_analyst LOGIN;' \
            -c 'GRANT CONNECT ON DATABASE "Finances_Test" TO rogue_analyst;'
          gate_must_fail "an undeclared login role holds CONNECT"
          psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c 'REVOKE ALL ON DATABASE "Finances_Test" FROM rogue_analyst;' \
            -c 'DROP ROLE rogue_analyst;'

          # Every case above must have been reverted, or the steps after this
          # one are running against a cluster this step left dirty.
          psql -v ON_ERROR_STOP=1 -d "Finances_Test" -f ../init-db/roles/assert-grants.sql

      # Issue #189, acceptance criterion 1. Proves the mechanic rather than the
      # intent: MB_DB_PASS was un-rotatable for the same reason POSTGRES_PASSWORD
      # still is — the only file that set it was a postgres initdb hook, which ran
      # once, on an empty PGDATA. 03-metabase-role.sql now carries an unconditional
      # ALTER ROLE … PASSWORD, and the assertion that matters is the negative one:
      # the OLD credential must stop working. A gate that only checked the new
      # password would pass against a role whose password had never changed.
      - name: Password rotation gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail

          # `psql -U metabase_user` inherits PGHOST=localhost, which reaches the
          # service container through port forwarding and so authenticates with a
          # password. A `trust` path would make every case here vacuous.
          connects_as() {
            PGPASSWORD="$1" psql -w -U metabase_user -d metabase -qtAc 'SELECT 1' >/dev/null 2>&1
          }

          rotate_to() {
            psql -q -v ON_ERROR_STOP=1 -d metabase \
              -v mb_user=metabase_user -v mb_password="$1" \
              -f ../init-db/roles/03-metabase-role.sql >/dev/null
          }

          # A password carrying a quote and a backslash, because the value is
          # interpolated through format(%L) rather than shell-expanded — the
          # property that keeps a legal password from breaking the statement.
          ROTATED="ci-rotated'pw\\with-quotes"

          rotate_to "$ROTATED"

          if connects_as 'ci-metabase-meta-pw'; then
            echo "::error::the pre-rotation MB_DB_PASS still authenticates — 03-metabase-role.sql did not apply the new password, so MB_DB_PASS is not rotatable from .env (issue #189)."
            exit 1
          fi
          echo "ok  the pre-rotation MB_DB_PASS is refused"

          if ! connects_as "$ROTATED"; then
            echo "::error::the rotated MB_DB_PASS does not authenticate — 03-metabase-role.sql set something other than the value it was given (issue #189)."
            exit 1
          fi
          echo "ok  the rotated MB_DB_PASS connects"

          # Restore, or every later step runs against a cluster this one moved.
          rotate_to 'ci-metabase-meta-pw'
          connects_as 'ci-metabase-meta-pw'
          echo "ok  restored"

      # Issue #189, acceptance criterion 2. POSTGRES_PASSWORD is the one
      # credential the stack cannot rotate for you: migrate authenticates AS that
      # role, so a .env that disagrees with the stored value locks it out before
      # any ALTER it would have issued could run. What is gated here is therefore
      # the quality of the failure, not a mechanism — the message has to survive,
      # or this degrades back to a bare `password authentication failed` from
      # whichever psql happened to run first.
      #
      # A failure between the ALTER and the restore leaves this cluster's
      # superuser password rotated for the remaining steps. Acceptable: CI has
      # already failed by then, and the runner is torn down.
      - name: Superuser preflight gate
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail

          bash scripts/preflight-superuser.sh
          echo "ok  preflight passes when .env matches the volume"

          # Exactly the drift an operator causes by editing POSTGRES_PASSWORD on
          # an existing volume: the stored password moves, .env does not.
          psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER ROLE postgres PASSWORD 'ci-rotated-superuser-pw';"

          if out="$(bash scripts/preflight-superuser.sh 2>&1)"; then
            echo "::error::preflight-superuser.sh passed while POSTGRES_PASSWORD did not match the stored password (issue #189)."
            exit 1
          fi

          # Assert on the message, not just the exit code. Both of these are what
          # make the failure actionable rather than merely loud.
          for needle in '\password postgres' 'docs/database.md#rotating-a-role-password'; do
            if ! grep -qF -- "$needle" <<<"$out"; then
              echo "::error::the preflight failure no longer names '${needle}'. It is the operator's only pointer to the rotation procedure (issue #189)."
              echo "$out"
              exit 1
            fi
          done
          echo "ok  preflight fails actionably on a superuser mismatch"

          PGPASSWORD=ci-rotated-superuser-pw psql -q -v ON_ERROR_STOP=1 -d postgres \
            -c "ALTER ROLE postgres PASSWORD 'changeme';"
          bash scripts/preflight-superuser.sh
          echo "ok  restored"

      - name: Schema drift gate
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
        run: |
          # Run drizzle-kit generate. If schema.ts diverges from the latest
          # meta snapshot, a new migration SQL file appears under drizzle/migrations/.
          # Anything new in the working tree there = schema.ts was edited
          # without a matching migration being committed.
          npx drizzle-kit generate --name drift_check
          if [ -n "$(git status --porcelain drizzle/migrations/)" ]; then
            echo ""
            echo "::error::Schema drift detected: drizzle/schema.ts diverges from the latest migration snapshot."
            echo "Run 'npm run db:generate -- --name <description>' locally and commit the generated migration."
            git status drizzle/migrations/
            exit 1
          fi

      - name: Seed reference gate
        run: npm run check:seed-references

      # Issue #187. The static gate above proves the seed file *says* the right
      # thing; this proves it *does* it. migrate-and-seed.sh used to skip the
      # Finances seed whenever the DB held any accounts or transactions, so a
      # populated database never received a reference row added later — which is
      # how production ended up permanently missing transaction_types id=12.
      # Builds a database in exactly that state (user data present, one canonical
      # row dropped), re-applies the real seed file the migrate service runs, and
      # asserts the row comes back with user data untouched.
      - name: Reference backfill gate
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: changeme
        run: |
          set -euo pipefail
          CHECK_DB=Finances_Backfill_Check
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE \"${CHECK_DB}\";"
          DATABASE_URL="postgresql://postgres:changeme@localhost:5432/${CHECK_DB}" npm run db:migrate
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" -f ../init-db/seeds/shared-lookups.sql

          # A populated database — this is what the old row-count guard skipped
          # on. 'Checking Account' under Current Asset must pick up its liquidity
          # default; 'Earmarked' under Current Liability shares a name with a
          # restricted asset type and must NOT, which is what scoping the
          # liquidity UPDATEs to the asset categories buys.
          #
          # The transaction below references transaction_category_id 6 without
          # creating it first, which it could not do before issue #178: the FK is
          # the assertion that the seed above ships the opening-balance category.
          # It is then renamed, the way a user renames it in /settings/categories,
          # to prove the re-apply below leaves that edit alone.
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" <<'SQL'
          INSERT INTO account_types (account_type, account_type_category_id) VALUES
              ('Checking Account', 1),
              ('Earmarked', 5);
          INSERT INTO accounts (account_name, account_type_id)
              SELECT 'Backfill Check Account', account_type_id
              FROM account_types WHERE account_type = 'Checking Account';
          INSERT INTO transactions
              (transaction_description, transaction_date, account_id, amount,
               transaction_type_id, transaction_category_id)
              SELECT 'Backfill check expense', CURRENT_DATE, account_id, -10.00, 2, 6
              FROM accounts WHERE account_name = 'Backfill Check Account';
          UPDATE transaction_categories
              SET transaction_category = 'Miscellaneous'
              WHERE transaction_category_id = 6;
          SQL

          # Reproduce the production drift, then apply the fix.
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" \
            -c 'DELETE FROM transaction_types WHERE transaction_type_id = 12;'
          psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" -f ../init-db/seeds/shared-lookups.sql

          # One exception listing every failure, as assert-grants.sql does.
          if ! psql -v ON_ERROR_STOP=1 -d "${CHECK_DB}" <<'SQL'
          DO $$
          DECLARE
              failures text[] := '{}';
              actual   text;
              n        bigint;
          BEGIN
              SELECT transaction_type INTO actual
              FROM transaction_types WHERE transaction_type_id = 12;
              IF actual IS DISTINCT FROM 'Opening Balance' THEN
                  failures := failures || format(
                      'transaction_types id=12 was not backfilled (got %L)', actual);
              END IF;

              SELECT count(*) INTO n FROM accounts;
              IF n <> 1 THEN failures := failures || format('accounts changed: %s (want 1)', n); END IF;

              SELECT count(*) INTO n FROM transactions;
              IF n <> 1 THEN failures := failures || format('transactions changed: %s (want 1)', n); END IF;

              SELECT liquidity_class INTO actual
              FROM account_types WHERE account_type = 'Checking Account';
              IF actual IS DISTINCT FROM 'liquid' THEN
                  failures := failures || format(
                      'asset type Checking Account should default to liquid (got %L)', actual);
              END IF;

              SELECT liquidity_class INTO actual
              FROM account_types WHERE account_type = 'Earmarked';
              IF actual IS NOT NULL THEN
                  failures := failures || format(
                      'liability type Earmarked must stay unclassified (got %L)', actual);
              END IF;

              SELECT last_value INTO n
              FROM pg_sequences
              WHERE schemaname = 'public' AND sequencename = 'transaction_types_transaction_type_id_seq';
              IF n IS NULL OR n < 12 THEN
                  failures := failures || format(
                      'transaction_types sequence not resynced past the seeded ids (got %s)', n);
              END IF;

              -- The opening-balance category the app writes on every account
              -- opened with an initial balance (issue #178). It must survive a
              -- user rename: the seed is ON CONFLICT DO NOTHING, so re-applying
              -- it reports drift on /api/health/seed-data rather than silently
              -- overwriting what the user chose to call this row.
              SELECT transaction_category INTO actual
              FROM transaction_categories WHERE transaction_category_id = 6;
              IF actual IS NULL THEN
                  failures := failures || 'transaction_categories id=6 is missing — shared-lookups.sql should ship it';
              ELSIF actual <> 'Miscellaneous' THEN
                  failures := failures || format(
                      'user rename of transaction_categories id=6 was clobbered (got %L, want %L)',
                      actual, 'Miscellaneous');
              END IF;

              SELECT count(*) INTO n FROM transaction_categories;
              IF n <> 1 THEN
                  failures := failures || format(
                      'shared-lookups.sql should seed exactly one transaction_categories row, found %s', n);
              END IF;

              -- Resolved through pg_get_serial_sequence rather than by name:
              -- this table's identity sequence is called
              -- transaction_type_categories_transaction_type_category_id_seq,
              -- a misnomer carried in from 0000_baseline. Hardcoding the
              -- conventional name here would look up nothing and read as a
              -- failure. Same reason the seed files call it.
              SELECT pg_sequence_last_value(
                  pg_get_serial_sequence('transaction_categories', 'transaction_category_id')::regclass
              ) INTO n;
              IF n IS NULL OR n < 6 THEN
                  failures := failures || format(
                      'transaction_categories sequence not resynced past the seeded ids (got %s)', n);
              END IF;

              IF array_length(failures, 1) > 0 THEN
                  RAISE EXCEPTION E'reference backfill gate failed:\n  - %',
                      array_to_string(failures, E'\n  - ');
              END IF;

              RAISE NOTICE 'reference backfill OK: transaction_types id=12 restored, transaction_categories id=6 shipped and its user rename preserved, user data and liability classification untouched';
          END
          $$;
          SQL
          then
            echo "::error::Reference backfill gate: re-running init-db/seeds/shared-lookups.sql against a populated database did not restore the canonical reference rows, or it disturbed user data. See app/scripts/migrate-and-seed.sh and the seed file's contract header (issue #187)."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -d postgres -c "DROP DATABASE \"${CHECK_DB}\";"

      - name: Changelog gate
        run: npm run check:changelog

      # Issue #186. Two hand-maintained lists index one directory — "## Guides"
      # in docs/README.md and "## Documentation" in README.md — and both had
      # silently fallen behind it. Scoped to the list sections, because the root
      # README links guides from prose too and a whole-file search reports those
      # as indexed.
      - name: Docs index gate
        run: npm run check:docs

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances_Test
          AUTH_SECRET: ci-only-integration-test-secret
        run: npm run test:integration

  # Issue #131. Builds the production image on every PR — previously it was only
  # built on a `v*` tag by release.yml, so a broken Dockerfile reached master
  # undetected — and scans it for known vulnerabilities. Runs as its own job so
  # the image build and the database-backed gates above don't queue behind each
  # other; both must be green to merge.
  image:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `docker compose build`, not a bare `docker build`: the runner and migrate
      # stages both do `COPY --from=repo …`, which needs the `repo` entry in
      # compose's additional_contexts (those files live outside ./app). This
      # matches how release.yml builds the images.
      #
      # All four services, not just finance-app (#224). The migrate stage was
      # never built here — `build finance-app` only walks the runner stage's
      # dependencies — so a broken COPY in it reached master undetected, and #224
      # added four of them. importer and pg-backup are new Dockerfiles that would
      # otherwise first be compiled on a release tag.
      - name: Build service images
        env:
          # Absolute path, for the same reason release.yml sets it: a relative
          # additional_contexts path is resolved against ./app rather than the
          # repo root on some Compose/buildx versions, and the files it carries
          # are at the root.
          REPO_CONTEXT: ${{ github.workspace }}
        run: docker compose build finance-app migrate importer pg-backup

      # Actions are SHA-pinned repo-wide (Issue #131) — mutable tags are exactly
      # how this action was used to ship malware in March 2026.
      #
      # Deliberately scoped to finance-app. finance-migrate, finance-importer and
      # finance-backup are compiled above but not scanned: their postgres and
      # python:3.14-slim bases carry OS CVEs on a different fix cadence, and
      # turning that into a merge gate here — before #226 decides what a published
      # image has to clear — would buy a permanently red job rather than safety.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: finance-app:latest
          severity: HIGH,CRITICAL
          # node:24-alpine carries OS CVEs with no upstream fix; blocking on
          # those makes the gate un-actionable rather than safer.
          ignore-unfixed: true
          exit-code: 1
          trivyignores: .trivyignore
