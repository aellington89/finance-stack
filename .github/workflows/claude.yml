name: Claude

# Mention @claude in an issue, a PR, or a review comment to hand Claude a task, e.g.
#   "@claude use the research skill on this issue"
#   "@claude review again"
#   "@claude address the review comments"
# Only the repository owner can trigger it. Needs the same secrets as claude-review.yml;
# without DEV_PROCESS_SSH_KEY it still runs, but without the shared skills.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    name: Claude
    if: |
      github.actor == github.repository_owner && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_PROCESS_KEY: ${{ secrets.DEV_PROCESS_SSH_KEY != '' }}
    steps:
      - name: Require a Claude token
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set. See https://github.com/aellington89/dev_process/blob/main/standards/repositories.md#secrets."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check out the dev process
        if: env.HAS_PROCESS_KEY == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aellington89/dev_process
          ssh-key: ${{ secrets.DEV_PROCESS_SSH_KEY }}
          path: .dev-process
      - name: Install the dev process
        if: env.HAS_PROCESS_KEY == 'true'
        run: node .dev-process/bin/dev-process.mjs install
      - uses: anthropics/claude-code-action@f431adaf77e0fecf918431e75a2b5b45b85af002 # v1.0.283
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
