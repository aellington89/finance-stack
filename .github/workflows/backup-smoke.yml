name: Backup smoke

# Proves the backup + restore round-trip works end-to-end, so silent backup
# corruption or a script regression is caught. GitHub runners cannot see the
# deployment host's ./backups/, so this job self-produces a dump from a known
# seeded dataset, restores it into a throwaway database, and asserts a known
# row count. (Verifying the *real* host dumps depends on phase-2 off-site
# upload — see docs/backups.md.)

on:
  schedule:
    - cron: '0 6 * * 1'        # Mondays 06:00 UTC
  workflow_dispatch:            # Manual runs
  pull_request:                 # Also guard PRs that touch the scripts/workflow
    paths:
      - 'scripts/backup.sh'
      - 'scripts/restore.sh'
      # Not exercised by the round-trip below, but this job owns the only
      # shellcheck step in the repo, so a shell file it lints has to be able to
      # trigger it — verify-db-roles.sh was listed there and could not.
      - 'scripts/verify-db-roles.sh'
      # Same reasoning. It was a three-line wrapper when this list was written,
      # which is why it was left out; #224 made it a real script that picks
      # which images to build, so it is worth linting like the rest.
      - 'scripts/build.sh'
      # Same reasoning again (#227): this job lints it, so an edit to it has to
      # be able to trigger the job that lints it.
      - 'scripts/check-deploy-parity.sh'
      # Same reasoning once more (#228). Its behaviour is covered by
      # deploy-smoke.yml; this job is still where it gets linted, so an edit to
      # it has to be able to trigger the lint.
      - 'deploy/deploy.sh'
      - 'app/scripts/*.sh'
      # The image these scripts now ship in (#224). This job exercises them from
      # the checkout rather than the image, so it does not prove the image is
      # right — but its base image is what keeps pg_dump version-matched to the
      # server, so a change there should re-run the round trip.
      - 'scripts/Dockerfile'
      - '.github/workflows/backup-smoke.yml'

jobs:
  backup-smoke:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to match docker-compose.yml (Issue #131); bumped by hand,
        # since Dependabot does not read workflow service containers.
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: changeme
      BACKUP_DIR: ${{ github.workspace }}/backups
      BACKUP_DBS: Finances
      BACKUP_RETENTION_DAYS: 3650   # Never prune within this short-lived job

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every shell script in the repo that is not a one-liner. app/scripts/ is
      # included because migrate-and-seed.sh gates the whole stack's startup and
      # preflight-superuser.sh is the failure path an operator sees when a
      # rotation goes wrong (#189) — both are worth linting even though neither
      # takes part in the backup round-trip below. deploy/deploy.sh (#228) is
      # here for the same reason: this job is the repo's single shellcheck owner,
      # and the script's own behaviour is exercised by deploy-smoke.yml.
      - name: Shellcheck scripts/
        run: |
          shellcheck scripts/backup.sh scripts/restore.sh scripts/verify-db-roles.sh \
                     scripts/build.sh scripts/check-deploy-parity.sh \
                     deploy/deploy.sh \
                     app/scripts/migrate-and-seed.sh app/scripts/preflight-superuser.sh

      - name: Install PostgreSQL 18 client
        # pg_dump must be >= the server major version (18); the runner's default
        # client can be older, so install the matching client from PGDG.
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Create Finances database
        run: psql -c 'CREATE DATABASE "Finances";'

      - name: Apply Drizzle migrations
        working-directory: app
        env:
          DATABASE_URL: postgresql://postgres:changeme@localhost:5432/Finances
        run: npm run db:migrate

      - name: Seed Finances with a known dataset
        run: |
          psql -d Finances -f init-db/seeds/shared-lookups.sql
          psql -d Finances -f init-db/seeds/finances-test-mock-data.sql
          psql -d Finances -f init-db/seeds/rebuild-balance-history.sql

      - name: Back up Finances
        run: ./scripts/backup.sh

      - name: Restore the latest Finances dump into a throwaway database
        run: ./scripts/restore.sh --force Finances Finances_Restore_Check

      - name: Assert known row count survived the round-trip
        run: |
          count="$(psql -d Finances_Restore_Check -tAc 'SELECT COUNT(*) FROM accounts;')"
          echo "accounts in restored database: $count"
          if [ "$count" != "8" ]; then
            echo "::error::Expected 8 accounts after restore, got $count — backup/restore round-trip is broken"
            exit 1
          fi
