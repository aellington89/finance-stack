# Triggered on every vX.Y.Z annotated tag push. Runs the version/tag-consistency gate
# (check:changelog), builds the Docker image with GIT_SHA + BUILD_TIME baked in, asserts
# /api/health reports the correct version + SHA on a fresh install, then publishes a GitHub Release whose
# body is the matching CHANGELOG.md section. The gate runs before any Docker work so a
# mismatched tag (tag ≠ package.json/CHANGELOG) fails fast without burning build time.
# See docs/releases.md and Issue #175.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # required for gh release create
  packages: write  # required to push the four service images to ghcr.io (#226)

jobs:
  release:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for git describe (previous tag) used in the compare link

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Gate: asserts package.json version == newest CHANGELOG release == pushed tag.
      # check-changelog.ts reads GITHUB_REF_TYPE / GITHUB_REF_NAME automatically on
      # tag pushes, so no args are needed. Exit 1 + ::error:: annotation on any drift.
      - name: Version & tag consistency gate
        run: npm run check:changelog

      # Compute stamp variables used by the Docker build and the Release body.
      # GIT_SHA uses the full 40-char SHA so it matches github.sha exactly — the same
      # value that ends up in finance-app:$GIT_SHA and in /api/health .build.gitSha.
      - name: Compute stamp variables
        working-directory: .
        run: |
          VER="${GITHUB_REF_NAME#v}"
          GIT_SHA="${{ github.sha }}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"

          echo "VER=$VER"             >> "$GITHUB_ENV"
          echo "GIT_SHA=$GIT_SHA"     >> "$GITHUB_ENV"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "PREV_TAG=$PREV_TAG"   >> "$GITHUB_ENV"
          # Absolute path for the `repo` additional build context (renamed from
          # `changelog` in #224 — it now carries init-db/ and scripts/ for the migrate
          # stage too). Passing an absolute path avoids the version-dependent Compose
          # behaviour where a relative additional_contexts path is resolved against
          # ./app instead of the repo root.
          echo "REPO_CONTEXT=${{ github.workspace }}" >> "$GITHUB_ENV"

      # Build via docker compose so the `repo` additional_contexts entry and the
      # GIT_SHA/BUILD_TIME build-args are wired exactly as they are in local builds
      # (matches scripts/build.sh and docker-compose.yml finance-app.build.args).
      #
      # All four services since #226, not just finance-app. The other three were
      # built implicitly by `docker compose up` in the verify step below, so a
      # broken importer or backup Dockerfile surfaced as a boot failure rather
      # than a build failure. They are published artifacts now, so they get built
      # by name — the same service list as ci.yml and scripts/build.sh.
      #
      # No local re-tagging here any more: nothing consumed `finance-app:$VER`
      # (compose runs the `:latest` tags), and the only tags that matter are the
      # registry ones, applied after verification in "Push verified images".
      - name: Build stamped Docker images
        working-directory: .
        run: docker compose build finance-app migrate importer pg-backup

      # Boot the full stack (postgres → migrate → finance-app) and assert /api/health
      # reports the expected version + SHA, then that Docker itself reports the container
      # healthy. We poll /api/health directly (rather than the container's own wget
      # healthcheck) so the assertion doesn't depend on the runner's wget flavour and so
      # the response body + service logs are captured on failure; the container verdict is
      # then checked separately, since that is the signal #191 was about.
      - name: Boot stack and verify /api/health
        working-directory: .
        # POSTGRES_DB is consumed by the postgres image itself at initdb. The Metabase
        # role vars go to the migrate job, which since #225 creates every database this
        # stack uses — MB_DB_PASS is what tells it to provision the metadata role at all,
        # so leaving it empty here would skip it silently rather than fail.
        # Metabase itself is profile-gated (bi) so it never starts here; only the role is created.
        # FINANCE_APP_DB is deliberately unset, so the app runs against a brand-new, empty
        # `Finances` — the real first-install path. Until #191 split the endpoints this job
        # had to point at the fully-seeded `Finances_Test` fixture instead, because the
        # bundled /api/health also asserted seed rows and a fresh Finances legitimately
        # tripped its drift 503 (transaction_categories are user-created — #178). Liveness
        # no longer inspects seed rows, so the smoke test can verify what a first-time
        # installer actually gets. Code↔seed agreement is gated separately, on every push,
        # by `npm run check:seed-references` (#155).
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: postgres
          MB_DB_USER: metabase
          MB_DB_PASS: changeme
          MB_DB_DBNAME: metabase
          AUTH_SECRET: release-smoke-test-only-secret
          # Required by the migrate service, which creates the least-privilege
          # service roles (#130) and aborts on an empty password. finance-app and
          # importer authenticate with these, so the health poll below only turns
          # 200 if the roles were created and granted correctly.
          FINANCE_APP_DB_PASSWORD: release-smoke-app-pw
          FINANCE_IMPORTER_DB_PASSWORD: release-smoke-importer-pw
          FINANCE_BI_DB_PASSWORD: release-smoke-bi-pw
        run: |
          docker compose up -d

          echo "Polling http://localhost:3001/api/health for a 200…"
          TIMEOUT=180
          ELAPSED=0
          # curl -fsS: non-zero exit on any non-2xx (e.g. the 503 the route returns when
          # the DB is unreachable), so the loop keeps waiting until a real 200.
          until HEALTH="$(curl -fsS http://localhost:3001/api/health 2>/dev/null)"; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "::error::/api/health did not return 200 within ${TIMEOUT}s"
              echo "--- last /api/health body (with status) ---"
              curl -s -w '\nHTTP %{http_code}\n' http://localhost:3001/api/health || true
              echo "--- migrate logs ---";     docker compose logs --no-color migrate     || true
              echo "--- finance-app logs ---";  docker compose logs --no-color finance-app || true
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          echo "Health response: $HEALTH"

          GOT_VER="$(echo "$HEALTH" | jq -r '.build.version')"
          GOT_SHA="$(echo "$HEALTH" | jq -r '.build.gitSha')"

          if [ "$GOT_VER" != "$VER" ]; then
            echo "::error::/api/health reported version '$GOT_VER', expected '$VER'"
            exit 1
          fi
          if [ "$GOT_SHA" != "$GIT_SHA" ]; then
            echo "::error::/api/health reported gitSha '$GOT_SHA', expected '$GIT_SHA'"
            exit 1
          fi

          echo "✓ /api/health: version=$GOT_VER  gitSha=${GOT_SHA:0:12}…"

          # Docker's own verdict on the container, which is the thing #191 fixed: on a
          # fresh, empty Finances the bundled endpoint returned 503 for seed drift and
          # finance-app sat `unhealthy` while serving fine. The poll above cannot catch a
          # regression here — it reads the route directly, bypassing the healthcheck — so
          # this asserts the wired-up result. Its own retry window exists because the
          # healthcheck has start_period 15s / interval 10s and may still read `starting`
          # the moment the route first answers.
          echo "Waiting for the finance-app container healthcheck…"
          APP_CID="$(docker compose ps -q finance-app)"
          HEALTH_TIMEOUT=60
          HEALTH_ELAPSED=0
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$APP_CID")" = "healthy" ]; do
            STATE="$(docker inspect -f '{{.State.Health.Status}}' "$APP_CID")"
            if [ "$HEALTH_ELAPSED" -ge "$HEALTH_TIMEOUT" ]; then
              echo "::error::finance-app reported '$STATE', expected 'healthy', after ${HEALTH_TIMEOUT}s"
              docker inspect -f '{{json .State.Health}}' "$APP_CID" | jq . || true
              echo "--- finance-app logs ---"; docker compose logs --no-color finance-app || true
              exit 1
            fi
            sleep 5
            HEALTH_ELAPSED=$((HEALTH_ELAPSED + 5))
          done

          echo "✓ finance-app container reports healthy on a fresh, empty Finances"

          # Security headers (#182), asserted against the real image rather than
          # the config. tests/unit/next-config-headers.test.ts covers the values
          # on every push; this covers the thing the acceptance criterion names —
          # that they survive the standalone build and reach the wire. Checked on
          # "/" and "/login", which sit outside the proxy's matcher.
          echo "Checking security headers…"
          for PATH_UNDER_TEST in / /login; do
            HEADERS="$(curl -sSI "http://localhost:3001${PATH_UNDER_TEST}")"

            for HEADER in \
              "Content-Security-Policy" \
              "Strict-Transport-Security" \
              "X-Frame-Options" \
              "X-Content-Type-Options" \
              "Referrer-Policy" \
              "Permissions-Policy" \
              "Cross-Origin-Opener-Policy"
            do
              if ! grep -qi "^${HEADER}:" <<<"$HEADERS"; then
                echo "::error::${HEADER} missing on ${PATH_UNDER_TEST}"
                echo "$HEADERS"
                exit 1
              fi
            done

            if grep -qi '^X-Powered-By:' <<<"$HEADERS"; then
              echo "::error::X-Powered-By present on ${PATH_UNDER_TEST} — poweredByHeader should be false"
              exit 1
            fi

            # 'unsafe-eval' and ws: are Turbopack dev relaxations. Their presence
            # here means the image was built with NODE_ENV !== production.
            CSP="$(grep -i '^Content-Security-Policy:' <<<"$HEADERS")"
            if grep -qE "unsafe-eval|ws:" <<<"$CSP"; then
              echo "::error::development CSP relaxations present on ${PATH_UNDER_TEST}: $CSP"
              exit 1
            fi

            echo "✓ security headers on ${PATH_UNDER_TEST}"
          done

          # The other three images this tag publishes (#226). `docker compose up`
          # booted them above, but nothing asserted they came up — so the publish
          # gate would have cleared four images on the strength of one image's
          # health check. Each assertion below is the cheapest available evidence
          # that the image itself works, not a full exercise of the service.
          echo "Checking the migrate, importer and pg-backup containers…"

          # finance-migrate. `ps -aq`, because this one has already exited. A
          # non-zero exit would have failed `up -d` through finance-app's
          # service_completed_successfully dependency, but publishing the image
          # while that stayed implicit is exactly the gap this closes.
          MIGRATE_CID="$(docker compose ps -aq migrate)"
          MIGRATE_EXIT="$(docker inspect -f '{{.State.ExitCode}}' "$MIGRATE_CID")"
          if [ "$MIGRATE_EXIT" != "0" ]; then
            echo "::error::migrate exited $MIGRATE_EXIT, expected 0"
            echo "--- migrate logs ---"; docker compose logs --no-color migrate || true
            exit 1
          fi
          echo "✓ finance-migrate completed successfully"

          # finance-backup. Its healthcheck only passes once a *.dump newer than
          # the interval exists under /backups, so this asserts pg_dump actually
          # ran and is version-matched to the server — the single constraint
          # scripts/Dockerfile exists to hold. start_period 60s / interval 60s
          # sets the floor on this timeout.
          echo "Waiting for the pg-backup container healthcheck…"
          BACKUP_CID="$(docker compose ps -q pg-backup)"
          BACKUP_TIMEOUT=150
          BACKUP_ELAPSED=0
          until [ "$(docker inspect -f '{{.State.Health.Status}}' "$BACKUP_CID")" = "healthy" ]; do
            STATE="$(docker inspect -f '{{.State.Health.Status}}' "$BACKUP_CID")"
            if [ "$BACKUP_ELAPSED" -ge "$BACKUP_TIMEOUT" ]; then
              echo "::error::pg-backup reported '$STATE', expected 'healthy', after ${BACKUP_TIMEOUT}s — no dump reached /backups"
              docker inspect -f '{{json .State.Health}}' "$BACKUP_CID" | jq . || true
              echo "--- pg-backup logs ---"; docker compose logs --no-color pg-backup || true
              exit 1
            fi
            sleep 5
            BACKUP_ELAPSED=$((BACKUP_ELAPSED + 5))
          done
          echo "✓ finance-backup produced a dump and reports healthy"

          # finance-importer has no healthcheck, so the assertion is that it is
          # still up rather than restart-looping — which is what a bad
          # DATABASE_URL, a missing finance_importer role, or an import that
          # crashes poll.py on startup all look like. Waiting out a full 60s poll
          # interval would only slow the release: the failure this catches
          # happens at start.
          sleep 30
          IMPORTER_CID="$(docker compose ps -q importer)"
          IMPORTER_STATE="$(docker inspect -f '{{.State.Status}} {{.RestartCount}}' "$IMPORTER_CID")"
          if [ "$IMPORTER_STATE" != "running 0" ]; then
            echo "::error::importer reported '$IMPORTER_STATE', expected 'running 0' — the container is down or restart-looping"
            echo "--- importer logs ---"; docker compose logs --no-color importer || true
            exit 1
          fi
          echo "✓ finance-importer is running"

      - name: Tear down stack
        working-directory: .
        if: always()
        run: docker compose down -v

      # Everything from here down runs only if every step above succeeded: a step
      # with no `if:` is skipped once the job has failed. That is the entire
      # mechanism behind "an image that fails its own smoke test never reaches the
      # registry" (#226) — do not add an `if:` to these two steps, and note that
      # the `if: always()` on the teardown above does not clear the job's failure.
      #
      # Login sits after the teardown deliberately, so the registry credential
      # never exists in the environment while the stack under test is running.
      - name: Log in to GHCR
        # Values reach the script through env rather than being interpolated into
        # it: a `${{ }}` expression is substituted before bash sees the line, so
        # keeping them out of the command text is the general rule even when, as
        # here, neither value can carry shell metacharacters.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Publishes the images that were just verified — the same bytes, re-tagged,
      # never a rebuild. (`docker compose images -q` lists images for *containers*,
      # which no longer exist after the teardown, so the local `image:` tags from
      # docker-compose.yml are the handle.)
      #
      # linux/amd64 only, and that follows from the ordering rather than being a
      # limitation to lift casually: verifying an image means *running* it, so a
      # multi-arch publish needs either a buildx multi-platform build whose arm64
      # half is booted on an arm64 runner, or a second self-hosted runner. Adding
      # `--platform linux/amd64,linux/arm64` on its own would publish an arm64
      # image that nothing ever started.
      #
      # THE FIRST PUBLISH NEEDS ONE MANUAL STEP: GHCR creates new packages
      # private, even from a public repo. After the first tag, open each of the
      # four packages' settings and set visibility to Public (and enable "Inherit
      # access from repository"), or `docker pull` on a deployment host will ask
      # for credentials. That is expected on run #1 and is not a workflow bug —
      # see docs/releases.md.
      - name: Push verified images to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # Lower-cased because GHCR rejects uppercase path segments; derived
          # rather than hardcoded so a fork or an owner rename still works.
          NS="ghcr.io/$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"

          {
            echo "## Published images"
            echo ""
            echo "| Image | Digest |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for IMG in finance-app finance-migrate finance-importer finance-backup; do
            # Both tags resolve to one manifest, so the second push uploads no
            # layers. $GIT_SHA is the full 40-char github.sha — the same value
            # /api/health reports as build.gitSha, which is what makes the :<sha>
            # tag mean "the image that answered that health check". Do not
            # shorten it here; scripts/build.sh uses --short for local builds only.
            for TAG in "$VER" "$GIT_SHA"; do
              docker tag "$IMG:latest" "$NS/$IMG:$TAG"
              docker push "$NS/$IMG:$TAG"
            done

            # Recorded in the run summary so the published digests are auditable
            # from the Actions page rather than only from the registry.
            DIGEST="$(docker inspect -f '{{range .RepoDigests}}{{println .}}{{end}}' "$NS/$IMG:$VER" \
                      | grep "^$NS/$IMG@" | head -1 || true)"
            echo "| \`$NS/$IMG:$VER\` | \`${DIGEST#*@}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "✓ pushed $NS/$IMG at :$VER and :$GIT_SHA"
          done

      # Slice the release body straight out of CHANGELOG.md (docs/releases.md step 4).
      # Captures everything between "## [X.Y.Z]" and the next "## [" header, then
      # appends a Full Changelog compare link when a previous tag exists.
      - name: Slice release body from CHANGELOG
        working-directory: .
        run: |
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\] " { flag=1; next }
            /^## \[/                 { flag=0 }
            flag
          ' CHANGELOG.md | sed 's/[[:space:]]*$//' > notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "" >> notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}" >> notes.md
          fi

          echo "--- release body ---"
          cat notes.md

      - name: Publish GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
