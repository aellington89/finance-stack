name: Triage

# Gives every new issue and pull request what
# https://github.com/aellington89/dev_process/blob/main/standards/labels.md says it opens with,
# when whoever opened it didn't: the repository's owner as assignee, labels from its title, and,
# on a pull request someone else opened (Dependabot's, say), a review request for the owner, which
# puts it in the owner's pull requests Inbox. Anything already set is left alone. The logic is in
# scripts/dev-process/triage.mjs.
#
# Dependabot's pull requests get a read-only token unless the workflow asks for more, which the
# permissions below do. The script comes from the default branch, never from the pull request.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    name: Assign and label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Skip until the script is on the default branch
        if: hashFiles('scripts/dev-process/triage.mjs') == ''
        run: echo "::notice::scripts/dev-process/triage.mjs isn't on the default branch yet, so triage is skipped."
      - if: hashFiles('scripts/dev-process/triage.mjs') != ''
        run: node scripts/dev-process/triage.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
