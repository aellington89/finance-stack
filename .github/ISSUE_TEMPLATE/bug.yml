name: Bug
description: Something is broken or behaves unexpectedly
title: 'X.Y.Z · '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        - **Title:** `<feature id>.<n> · <name>`, for example `1.4.2 · Tag Filter Resets on Reload`.
        - **Next step:** `/triage`, weekly, which gives it a stage, a milestone, and its Size and Priority on the repository's GitHub project. Add `release: blocker` if this can lose or corrupt user data, or breaks a core flow.
        - **Standard:** [standards/issues.md](https://github.com/aellington89/dev_process/blob/main/standards/issues.md)
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.0.4, or a commit SHA when running from source
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: The operating system, browser, or device, and anything else that matters
  - type: checkboxes
    id: impact
    attributes:
      label: Impact
      options:
        - label: User data can be lost or corrupted
        - label: Regression (this used to work)
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or notes
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we'll know it's fixed, including the regression test.
      value: |
        - [ ] A test reproduces the bug and passes with the fix
        - [ ]
